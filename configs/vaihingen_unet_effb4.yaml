# 实验 B1：ISPRS Vaihingen + U-Net(EfficientNet-B4)
# 数据只有 33 幅大图（切成 ~1300 个 512 tile），必须靠强增强 + 预训练权重。
# 4 通道（NIR-R-G）能显著提升"植被 vs 建筑"，有 DSM 的话再加 1 通道 nDSM。
exp_name: vaihingen_unet_effb4
seed: 42
num_classes: 6

data:
  preset: vaihingen       # 0 不透水面→道路, 1 建筑, 2/3 植被, 4/5 忽略
  crop_size: 512
  batch_size: 4
  num_workers: 4
  in_channels: 3          # 用 NIR 时改 4，并把 encoder_weights 的首层改成随机初始化
  balance_sampler: false
  val_stride: 256         # 验证滑窗步长（256=50% 重叠，最准也最慢；显存/时间紧可设 512）
  val_max_images: 150    # 每 epoch 只验证 150 幅（全量验证太慢，最终评估再跑全量）

model:
  arch: unet
  encoder: efficientnet-b4   # Vaihingen 上的经典强组合
  encoder_weights: imagenet
  pretrained: true

train:
  epochs: 60
  lr: 3.0e-4
  weight_decay: 1.0e-4
  backbone_lr_scale: 0.1
  grad_accum: 2
  amp: true
  grad_clip: 1.0
  warmup_epochs: 2
  poly_power: 0.9
  early_stop_patience: 15
  class_weight: true
  loss:
    name: ce_dice
    ce_weight: 1.0
    dice_weight: 1.0
    label_smoothing: 0.0
