name: smoke-tests

# 只跑"不依赖 torch / GPU"的部分，任何 push 都能在 1 分钟内验证核心逻辑没坏。
# 深度学习部分（models/losses/engine）需要装 torch，见 README 的"快速开始"。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow matplotlib scipy

      - name: Unit tests (10 cases)
        run: python tests/test_smoke.py

      - name: End-to-end pipeline on synthetic data
        run: |
          python scripts/make_sample_data.py --n-train 2 --n-val 1 --points-per-class 5 --out /tmp/sample
          python scripts/run_baseline.py --data /tmp/sample --out /tmp/out

      - name: Check outputs exist
        run: |
          test -f /tmp/out/demo_landcover_map.png
          test -f /tmp/out/metrics_baseline.json
          echo "OK: 主图与指标都已生成"
